<body class="bg-textured font-body text-on-surface antialiased">
<!-- Navigation Suppressed for Login Journey as per "The Destination Rule" -->
<main class="min-h-screen flex items-center justify-center p-6 sm:p-12">
<div class="w-full max-w-md relative">
<!-- Branding Header -->
<div class="mb-12 text-center">
<span class="font-headline text-xl font-bold tracking-tight text-primary uppercase tracking-[0.2em] block mb-4">The Digital Artisan</span>
<h1 class="font-headline text-4xl font-extrabold text-on-surface tracking-tight mb-2">Welcome Back</h1>
<p class="text-on-surface-variant font-body text-sm">Continue your artisan journey.</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-xl p-8 sm:p-10 shadow-[0_20px_40px_rgba(46,52,50,0.06)] ring-1 ring-on-surface/5">
<form action="#" class="space-y-6" method="POST">
<!-- Email Field -->
<div class="space-y-2">
<label class="block text-xs font-semibold uppercase tracking-widest text-on-surface-variant px-1" for="email">Email Address</label>
<div class="relative group">
<input class="w-full bg-surface-container-highest/40 border-none rounded-sm px-4 py-3 text-on-surface placeholder:text-outline focus:ring-1 focus:ring-primary focus:bg-surface-container-lowest transition-all duration-200 text-sm outline-none" id="email" name="email" placeholder="name@artisan.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center px-1">
<label class="block text-xs font-semibold uppercase tracking-widest text-on-surface-variant" for="password">Password</label>
<a class="text-[10px] uppercase font-bold tracking-widest text-primary hover:text-primary-dim transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative group">
<input class="w-full bg-surface-container-highest/40 border-none rounded-sm px-4 py-3 text-on-surface placeholder:text-outline focus:ring-1 focus:ring-primary focus:bg-surface-container-lowest transition-all duration-200 text-sm outline-none" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary hover:bg-primary-dim text-on-primary font-headline font-bold py-4 rounded-md transition-all duration-300 active:scale-[0.98] mt-4 shadow-sm" type="submit">
                        Enter Workshop
                    </button>
</form>
<!-- Divider -->
<div class="relative my-8">
<div aria-hidden="true" class="absolute inset-0 flex items-center">
<div class="w-full border-t border-surface-container-high"></div>
</div>
<div class="relative flex justify-center text-xs uppercase tracking-[0.2em]">
<span class="bg-surface-container-lowest px-4 text-on-surface-variant font-medium">Or Connect Via</span>
</div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-3 bg-surface-container-low hover:bg-surface-container-high text-on-surface-variant font-label text-xs font-bold py-3 px-4 rounded-md transition-colors border border-on-surface/5">
<span class="material-symbols-outlined text-[18px]">google</span>
<span>GOOGLE</span>
</button>
<button class="flex items-center justify-center gap-3 bg-surface-container-low hover:bg-surface-container-high text-on-surface-variant font-label text-xs font-bold py-3 px-4 rounded-md transition-colors border border-on-surface/5">
<span class="material-symbols-outlined text-[18px]">ios</span>
<span>APPLE</span>
</button>
</div>
</div>
<!-- Create Account Footer -->
<p class="mt-8 text-center text-sm text-on-surface-variant">
                New to the heritage? 
                <a class="text-primary font-bold hover:underline decoration-primary-container decoration-2 underline-offset-4 transition-all" href="#">Create Account</a>
</p>
</div>
</main>
<!-- Content-Focused Footer -->
<footer class="w-full py-8 bg-[#f2f4f2] dark:bg-stone-900 flex flex-col items-center gap-4">
<div class="flex gap-6">
<a class="font-['Inter'] text-[10px] uppercase tracking-widest text-[#2e3432]/50 hover:text-[#8D5B4C] transition-colors" href="#">Privacy Policy</a>
<a class="font-['Inter'] text-[10px] uppercase tracking-widest text-[#2e3432]/50 hover:text-[#8D5B4C] transition-colors" href="#">Terms of Service</a>
<a class="font-['Inter'] text-[10px] uppercase tracking-widest text-[#2e3432]/50 hover:text-[#8D5B4C] transition-colors" href="#">Contact Support</a>
</div>
<p class="font-['Inter'] text-[10px] uppercase tracking-widest text-[#2e3432]/50 opacity-80">
            © 2024 The Digital Artisan. Preserving Heritage.
        </p>
</footer>
