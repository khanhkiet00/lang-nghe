<p class="text-on-surface-variant text-sm md:text-base leading-relaxed max-w-[280px] mb-10">

<form action="#" class="w-full space-y-10">
<div class="flex justify-between gap-2 md:gap-3">
<input aria-label="Digit 1" class="otp-input w-11 h-14 md:w-14 md:h-16 text-center text-2xl font-semibold border-none rounded-sm bg-surface-container-highest/40 focus:ring-0 transition-all duration-200" maxlength="1" pattern="\d*" type="text"/>
<input aria-label="Digit 2" class="otp-input w-11 h-14 md:w-14 md:h-16 text-center text-2xl font-semibold border-none rounded-sm bg-surface-container-highest/40 focus:ring-0 transition-all duration-200" maxlength="1" pattern="\d*" type="text"/>
<input aria-label="Digit 3" class="otp-input w-11 h-14 md:w-14 md:h-16 text-center text-2xl font-semibold border-none rounded-sm bg-surface-container-highest/40 focus:ring-0 transition-all duration-200" maxlength="1" pattern="\d*" type="text"/>
<input aria-label="Digit 4" class="otp-input w-11 h-14 md:w-14 md:h-16 text-center text-2xl font-semibold border-none rounded-sm bg-surface-container-highest/40 focus:ring-0 transition-all duration-200" maxlength="1" pattern="\d*" type="text"/>

                    </button>
<div class="flex flex-col items-center gap-2">
<button class="text-on-surface-variant/40 font-medium text-sm flex items-center gap-2 cursor-not-allowed" disabled="" type="button">
