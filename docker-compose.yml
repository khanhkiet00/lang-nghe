services:

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: langnghe
      POSTGRES_PASSWORD: langnghe123
      POSTGRES_DB: langnghe_dev
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langnghe -d langnghe_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports: ["6379:6379"]
    volumes: [redis_data:/data]

  adminer:
    image: adminer:latest
    ports: ["8080:8080"]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports: ["3001:3001"]
    volumes: ["./backend:/app", "/app/node_modules"]
    environment:
      DATABASE_URL: postgresql://langnghe:langnghe123@postgres:5432/langnghe_dev
      REDIS_URL: redis://redis:6379
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports: ["3000:3000"]
    volumes: ["./frontend:/app", "/app/node_modules", "/app/.next"]
    env_file: .env
    environment:
      # Use service name instead of localhost for inter-container communication
      NEXT_PUBLIC_API_URL: http://backend:3001/api/v1
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    ports: ["80:80"]
    volumes: ["./nginx/nginx.local.conf:/etc/nginx/nginx.conf:ro"]
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  redis_data:
